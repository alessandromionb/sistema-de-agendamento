networks:
  netatividade01:
    driver: bridge

volumes:
  postgres_data:

services:

  # ──────────────────────────────────────────
  # Banco de dados PostgreSQL
  # ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: postgres_agendamentos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netatividade01
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────
  # Loki para coleta centralizada de logs
  # ──────────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: loki_agendamentos
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    networks:
      - netatividade01

  # ──────────────────────────────────────────
  # Backend FastAPI
  # ──────────────────────────────────────────
  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_agendamentos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      LOKI_URL: http://loki:3100
    networks:
      - netatividade01
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      loki:
        condition: service_started
    # NÃO expõe porta para o hospedeiro — tráfego apenas pela rede interna

  # ──────────────────────────────────────────
  # Servidor NGINX (proxy reverso + frontend)
  # ──────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx_agendamentos
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - netatividade01
    volumes:
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - fastapi
