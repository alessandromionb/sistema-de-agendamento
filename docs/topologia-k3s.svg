<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Topologia K3s do Sistema de Agendamentos</title>
  <desc id="desc">Cluster K3s com VM1 de dados executando PostgreSQL e Loki, VM2 de aplicação executando NGINX e FastAPI, e somente NGINX exposto ao host.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .vm { fill: #ffffff; stroke: #334155; stroke-width: 2; rx: 14; }
      .data { fill: #ecfdf5; stroke: #047857; stroke-width: 2; rx: 10; }
      .app { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 2; rx: 10; }
      .svc { fill: #ffffff; stroke: #64748b; stroke-width: 1.5; rx: 8; }
      .title { font-family: Arial, sans-serif; font-size: 28px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; fill: #475569; }
      .label { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #0f172a; }
      .text { font-family: Arial, sans-serif; font-size: 14px; fill: #334155; }
      .small { font-family: Arial, sans-serif; font-size: 12px; fill: #475569; }
      .arrow { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .internal { stroke: #0f766e; stroke-width: 3; stroke-dasharray: 10 8; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#334155" />
    </marker>
  </defs>

  <rect class="bg" width="1200" height="680" />
  <text x="600" y="54" text-anchor="middle" class="title">Grupo 5 - Sistema de Agendamentos em K3s</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Separação obrigatória: dados na VM1, aplicação na VM2, comunicação pela rede interna do cluster</text>

  <rect x="70" y="130" width="480" height="420" class="vm" />
  <text x="310" y="168" text-anchor="middle" class="label">VM1 - Dados</text>
  <text x="310" y="194" text-anchor="middle" class="text">K3s agent | nodeSelector: camada=dados</text>

  <rect x="130" y="240" width="160" height="120" class="data" />
  <text x="210" y="286" text-anchor="middle" class="label">PostgreSQL</text>
  <text x="210" y="312" text-anchor="middle" class="text">StatefulSet</text>
  <text x="210" y="336" text-anchor="middle" class="small">ClusterIP 5432 + PVC</text>

  <rect x="330" y="240" width="160" height="120" class="data" />
  <text x="410" y="286" text-anchor="middle" class="label">Loki</text>
  <text x="410" y="312" text-anchor="middle" class="text">Deployment</text>
  <text x="410" y="336" text-anchor="middle" class="small">ClusterIP 3100 + PVC</text>

  <rect x="650" y="130" width="480" height="420" class="vm" />
  <text x="890" y="168" text-anchor="middle" class="label">VM2 - Aplicação</text>
  <text x="890" y="194" text-anchor="middle" class="text">K3s server | nodeSelector: camada=aplicacao</text>

  <rect x="710" y="240" width="160" height="120" class="app" />
  <text x="790" y="286" text-anchor="middle" class="label">NGINX</text>
  <text x="790" y="312" text-anchor="middle" class="text">2 réplicas</text>
  <text x="790" y="336" text-anchor="middle" class="small">NodePort 30080/30443</text>

  <rect x="910" y="240" width="160" height="120" class="app" />
  <text x="990" y="286" text-anchor="middle" class="label">FastAPI</text>
  <text x="990" y="312" text-anchor="middle" class="text">2 réplicas</text>
  <text x="990" y="336" text-anchor="middle" class="small">ClusterIP 8080</text>

  <rect x="445" y="585" width="310" height="48" class="svc" />
  <text x="600" y="614" text-anchor="middle" class="text">Rede interna do cluster K3s</text>

  <path d="M 870 300 L 910 300" class="arrow" />
  <path d="M 990 360 C 990 455 210 455 210 360" class="internal" />
  <path d="M 990 360 C 990 505 410 505 410 360" class="internal" />
  <path d="M 790 210 L 790 120" class="arrow" />
  <text x="790" y="108" text-anchor="middle" class="text">Acesso externo somente pelo NGINX</text>
  <text x="210" y="392" text-anchor="middle" class="small">sem porta exposta no host</text>
  <text x="410" y="392" text-anchor="middle" class="small">sem porta exposta no host</text>
  <text x="990" y="392" text-anchor="middle" class="small">sem porta exposta no host</text>
</svg>
